name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete fetched history
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/secret-scan.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          test -e .git
          git rev-parse --verify HEAD > /dev/null
          git_dir=$(git rev-parse --absolute-git-dir)
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$work/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $work/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$work/gitleaks.tar.gz" -C "$work" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$work/config.toml"
          # Gitleaks always reads source/.gitleaksignore; use Git metadata, not the worktree.
          status=0
          "$work/gitleaks" git "$git_dir" --log-opts="--all" \
            --config "$work/config.toml" --gitleaks-ignore-path /dev/null \
            --ignore-gitleaks-allow --redact=100 --no-banner --log-level error \
            --report-format json --report-path "$work/report.json" \
            > "$work/scanner.log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            if [ "$status" -eq 1 ] && [ -s "$work/report.json" ]; then
              python3 - "$work/report.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report:
              findings = json.load(report)
          print(json.dumps([
              {"path": item["File"], "type": item["RuleID"], "fingerprint": item["Fingerprint"]}
              for item in findings
          ], ensure_ascii=True, indent=2))
          PY
            fi
            echo 'Secret scan failed. Only path/type/fingerprint are shown; scanner diagnostics and source are withheld.'
            exit "$status"
          fi
          echo 'Secret scan passed for complete fetched history.'
