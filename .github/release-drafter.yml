name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  # Order matters: `exclusive` stops a pull request from also landing in a
  # later section, so each change is listed once under its most significant type.
  - title: "👀 Breaking changes"
    exclusive: true
    when:
      label: "major"
  - title: "🚀 Features"
    exclusive: true
    when:
      labels:
        - "feature"
        - "minor"
  - title: "🐛 Bug Fixes"
    exclusive: true
    when:
      labels:
        - "bug"
        - "patch"
  - title: "🧰 Maintenance"
    exclusive: true
    when:
      label: "chore"
  - title: "📖 Docs"
    when:
      - label: "docs"
      # Most code changes also touch a README; only Markdown-only changes are docs.
      - paths:
          - "*.md"
        paths-mode: only
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "major"
        - "minor"
  - type: "version-resolver"
    semver-increment: "patch"

template: |
  $CHANGES

change-template: "- $TITLE #$NUMBER (@$AUTHOR)"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.

# Matchers within a rule are OR'ed, so file matchers label every PR that merely
# touches those files; rules key off branch names and titles instead.
autolabeler:
  - label: "chore"
    branch:
      - '/patch\/.+/'
      - '/renovate\/.+/'
  - label: "docs"
    branch:
      - '/docs?\/.+/'
  - label: "bug"
    branch:
      - '/fix\/.+/'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: "feature"
    branch:
      - '/feature\/.+/'
    body:
      - "/US-[0-9]{1,4}/"
